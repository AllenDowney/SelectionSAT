name: Check code

# Static checks: pyflakes on the Python files, and a check that every
# notebook's code parses and its md/ copy is current. Running the notebooks
# would refit every model (slow), so CI doesn't.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyflakes jupytext
      - run: make check
